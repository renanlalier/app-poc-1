version: 1
repo_role: product

defaults:
  cli: claude-code
  execution_target: local
  models:
    frontend-engineer: claude-sonnet-4-6
    qa: claude-sonnet-4-6

roles_enabled: [frontend-engineer, qa]

stack:
  runtime: node@22
  language: javascript
  framework: react
  bundler: vite
  test: [vitest, testing-library]

constraints:
  forbid_paths:
    - .github/workflows/**    # the agent does not modify the pipeline itself
    - .agentic/config.yml     # nor its own configuration
    - .agentic/skills/**      # nor repo-specific skills
    # .agentic/memory/** is intentionally writable by agents
  forbid_dependencies_add: true

memory:
  enabled: true
  consolidate_after_execution: true
  max_episodes: 20

gates:
  - build
  - test

pr:
  base_branch: main
  draft: true
  labels: [agentic]

secrets:
  source: vault
