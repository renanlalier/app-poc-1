version: 1
repo_role: product

defaults:
  cli: dry-run          # switch to cursor when you have CURSOR_API_KEY
  models:
    frontend-engineer: dry-run
    qa: dry-run

roles_enabled: [frontend-engineer, qa]

stack:
  runtime: node@22
  language: javascript
  framework: react
  bundler: vite
  test: [vitest, testing-library]

constraints:
  forbid_paths:
    - .github/workflows/**    # the agent does not modify the pipeline itself
    - .agentic/**              # nor its own configuration
  forbid_dependencies_add: true

gates:
  - build
  - test

pr:
  base_branch: main
  draft: true
  labels: [agentic]
